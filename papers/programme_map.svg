<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-label="The case for an emergency rent brake: why the usual objection does not hold, the welfare argument and the evidence behind the brake, the policy itself, and the one question still open." style="width:100%;height:auto;max-width:900px;display:block;margin:0 auto;font-family:'Nunito Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<title>The case for a rent brake, on one screen</title>
